name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (API and client)
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build client
        run: bun run build
